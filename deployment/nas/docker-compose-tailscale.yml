version: '3.8'

services:
  backend:
    image: ghcr.io/c3dr1c86/inventaire/backend:latest
    container_name: inventaire-backend
    restart: unless-stopped
    user: "0:0"  # Fix permissions pour volumes NAS
    environment:
      - SECRET_KEY=ac68ceb02c5ca196e5d82e7290f1c053e08cd865caaea43ffe1da3fe7ad27ca8
      - DATABASE_URL=sqlite:///./database/inventaire.db
      # IMPORTANT: Avec Nginx proxy, CORS pas nécessaire (même origine)
      # mais on laisse pour compatibilité
      - CORS_ORIGINS=https://inventaire-nas.tail53f399.ts.net,http://localhost
    volumes:
      - ./data/database:/app/database
      - ./data/exports:/app/exports
      - ./data/uploads:/app/uploads
    networks:
      - inventaire-network
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/c3dr1c86/inventaire/frontend:latest
    container_name: inventaire-frontend
    restart: unless-stopped
    environment:
      # IMPORTANT: Chemin relatif car Nginx proxy gère la redirection
      - VITE_API_URL=/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - inventaire-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tailscale:
    image: tailscale/tailscale:latest
    container_name: inventaire-tailscale
    restart: unless-stopped
    hostname: inventaire-nas
    environment:
      # IMPORTANT: Remplacez par votre Auth Key Tailscale
      # Obtenu sur: https://login.tailscale.com/admin/settings/keys
      - TS_AUTHKEY=tskey-auth-kGxY7WTQoB21CNTRL-idWAm8WBNcBu4XYFAJSgcB1posMDVGC1
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--reset --accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - inventaire-network
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1

  # Proxy Nginx pour exposer via Tailscale avec un seul point d'entrée
  tailscale-proxy:
    image: nginx:alpine
    container_name: inventaire-tailscale-proxy
    restart: unless-stopped
    volumes:
      - ./nginx-tailscale.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      tailscale:
        condition: service_started
    # IMPORTANT: Utilise le réseau du conteneur Tailscale
    # Cela permet d'exposer le proxy sur l'interface Tailscale
    network_mode: "service:tailscale"

networks:
  inventaire-network:
    driver: bridge

volumes:
  tailscale-state:
    driver: local
