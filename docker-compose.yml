version: '3.8'

services:
  backend:
    image: ghcr.io/c3dr1c86/inventaire/backend:latest
    container_name: inventaire_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///./database/inventaire.db
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
      - CORS_ORIGINS=http://localhost,http://localhost:80
    volumes:
      - backend_data:/app/database
      - backend_exports:/app/exports
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - inventaire_network

  frontend:
    image: ghcr.io/c3dr1c86/inventaire/frontend:latest
    container_name: inventaire_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000/api
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - inventaire_network

volumes:
  backend_data:
    driver: local
  backend_exports:
    driver: local
  backend_uploads:
    driver: local

networks:
  inventaire_network:
    driver: bridge
