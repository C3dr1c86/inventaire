# Docker Compose avec Reverse Proxy Nginx
# Le frontend Nginx proxie les requêtes /api vers le backend
# Plus de problème CORS car tout vient de la même origine

services:
  # Backend FastAPI (NON exposé à l'extérieur)
  backend:
    image: inventaire-backend:latest
    container_name: inventaire_backend
    # PAS de ports exposés à l'extérieur - seulement accessible depuis le réseau Docker
    expose:
      - "8000"
    volumes:
      # Persister la base de données SQLite
      - ./data/database:/app/database
      # Persister les exports
      - ./data/exports:/app/exports
    environment:
      # Variables d'environnement pour le backend
      - SECRET_KEY=${SECRET_KEY:-changez-cette-cle-secrete-en-production}
      - DATABASE_URL=sqlite:///database/inventaire.db
    restart: unless-stopped
    networks:
      - inventaire_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React avec Nginx Reverse Proxy
  frontend:
    image: inventaire-frontend:latest
    container_name: inventaire_frontend
    ports:
      - "8080:80"  # Seul port exposé - sert le frontend ET proxie l'API
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - inventaire_network

networks:
  inventaire_network:
    driver: bridge

volumes:
  database_data:
  exports_data:
